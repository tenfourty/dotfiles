# Generated by ~/.local/bin/machine-manifest -- do not hand-edit blindly.
# Regenerate:  machine-manifest --write && chezmoi apply
#
# What a fresh machine needs ON TOP of a stock Fedora KDE install.
# The base ~880 spin packages are NOT listed; they come with the installer.
packages:
  copr:
    - scottames/ghostty
  repos:
    - name: adoptium-temurin-java-repository
      url: "https://packages.adoptium.net/artifactory/rpm/fedora/$releasever/$basearch"
    - name: claude-desktop-unofficial
      url: "https://pkg.claude-desktop-debian.dev/rpm/$basearch"
    - name: google-chrome
      url: "https://dl.google.com/linux/chrome/rpm/stable/x86_64"
    - name: tailscale
      url: "https://pkgs.tailscale.com/stable/fedora/$basearch"
    - name: terra
      url: "https://tetsudou.fyralabs.com/metalink?repo=terra$releasever&arch=$basearch"
  repo_overrides:
    - repo: google-chrome
      key: enabled
      value: 1
    - repo: terra
      key: priority
      value: 200
  dnf:
    - claude-desktop-unofficial
    - compat-ffmpeg4
    - ffmpeg
    - ghostty
    - google-chrome-stable
    - gstreamer1-plugins-bad-freeworld
    - gstreamer1-plugins-ugly
    - intel-media-driver
    - lpf-mscore-fonts
    - lpf-spotify-client
    - mozilla-openh264
    - openh264
    - pipewire-codec-aptx
    - rpmfusion-free-appstream-data
    - rpmfusion-free-obsolete-packages
    - rpmfusion-free-release
    - rpmfusion-free-release-tainted
    - rpmfusion-nonfree-appstream-data
    - rpmfusion-nonfree-release
    - telegram-desktop
    - terra-gpg-keys
    - terra-release
    - unrar
    - vlc-plugins-freeworld
  flatpak:
    - com.nextcloud.desktopclient.nextcloud
    - com.slack.Slack
    - io.github.prateekmedia.appimagepool
    - it.mijorus.gearlever
    - org.fkoehler.KTailctl
  cargo:
    - cargo-install-update
    - cargo-install-update-config
    - starship
    - topgrade
  uv:
    - ggshield
    - vcspull
